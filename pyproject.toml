[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="building-energy-hvac-digital-twin"
version="0.2.0"
description="Vendor-neutral, calibratable R&D digital twin for building energy and HVAC systems"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Vicena Research Twins"}]
dependencies=["numpy>=1.24","pandas>=2.0","scipy>=1.10","matplotlib>=3.7","jsonschema>=4.18","pillow>=10","scikit-learn>=1.3","joblib>=1.3","fastapi>=0.110","uvicorn>=0.27"]
[project.optional-dependencies]
dev=["pytest>=7","nbclient>=0.8","nbformat>=5","httpx>=0.27"]
[project.scripts]
hvac-twin="building_hvac_twin.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
